<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="cc-draw loop: open your app in cc-draw, draw on the page, send to Claude, Claude edits your files, the page reloads, repeat">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
  
  <g>
    <rect x="16" y="16" width="260" height="96" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="16" y="30" width="4" height="68" rx="2" fill="#6965db"/>
    <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6965db">1 · YOU</text>
    <text x="36" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Open your app in cc-draw</text>
    <text x="36" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#59636e">cc-draw . --proxy &lt;url&gt;</text>
  </g>
  <g>
    <rect x="320" y="16" width="260" height="96" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="320" y="30" width="4" height="68" rx="2" fill="#6965db"/>
    <text x="340" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6965db">2 · YOU</text>
    <text x="340" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Draw on the page</text>
    <text x="340" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">shapes, arrows, element picks</text>
  </g>
  <g>
    <rect x="624" y="16" width="260" height="96" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="624" y="30" width="4" height="68" rx="2" fill="#6965db"/>
    <text x="644" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8" fill="#6965db">3 · YOU</text>
    <text x="644" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Send to Claude</text>
    <text x="644" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">Ctrl+Enter · review panel</text>
  </g>
  <g>
    <rect x="624" y="178" width="260" height="96" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="624" y="192" width="4" height="68" rx="2" fill="#c2562f"/>
    <text x="644" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8" fill="#c2562f">4 · CLAUDE CODE</text>
    <text x="644" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Claude edits your files</text>
    <text x="644" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">one annotation at a time</text>
  </g>
  <g>
    <rect x="320" y="178" width="260" height="96" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="320" y="192" width="4" height="68" rx="2" fill="#1a7f64"/>
    <text x="340" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8" fill="#1a7f64">5 · CC-DRAW</text>
    <text x="340" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Page reloads</text>
    <text x="340" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">changes highlighted</text>
  </g>
  <path d="M280 64H314" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M584 64H618" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M754 116V172" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M620 226H586" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M450 174V118" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#a)"/>
  <text x="460" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#59636e">repeat</text>
  <rect x="16" y="178" width="260" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <text x="36" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">Every send is saved in</text>
  <text x="36" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1f2328">.cc-draw/feedback/</text>
</svg>
